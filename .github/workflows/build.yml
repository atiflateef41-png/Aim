name: Extract ZIP File

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Aim_NoRoot.zip
        run: |
          if [ -f "Aim_NoRoot.zip" ]; then
            unzip -o Aim_NoRoot.zip -d Aim_NoRoot/
            rm Aim_NoRoot.zip
          else
            echo "Aim_NoRoot.zip not found in the root directory!"
            exit 1
          fi

      - name: Commit and Push Extracted Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add .
          git commit -m "Extracted Aim_NoRoot.zip contents" || echo "No changes to commit"
          git push
          
